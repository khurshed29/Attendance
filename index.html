<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #bb86fc;
            --success: #03dac6;
            --danger: #cf6679;
            --neon-cyan: #00f0ff; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            background-attachment: fixed;
            color: var(--text-main);
            /* স্ক্রিনের বাইরে বডি স্ক্রল হবে না, শুধু ভেতরের লিস্ট স্ক্রল হবে */
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        /* হেডার ও কন্ট্রোল ফিক্সড রাখার জন্য */
        .fixed-top-section {
            flex-shrink: 0;
            margin-bottom: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }

        .header h1 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .shine-text {
            background: linear-gradient(90deg, rgba(0,240,255,1) 0%, rgba(255,255,255,1) 50%, rgba(0,240,255,1) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 2s linear infinite;
        }

        @keyframes shine {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-main);
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        input[type="date"], select {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 14px;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        /* শুধু এই অংশটুকু স্ক্রল হবে */
        .scrollable-list {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
            padding-right: 5px;
        }

        /* কাস্টম স্ক্রলবার ডিজাইন */
        .scrollable-list::-webkit-scrollbar { width: 6px; }
        .scrollable-list::-webkit-scrollbar-track { background: transparent; }
        .scrollable-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        /* List View (কম্প্যাক্ট ডিজাইন) */
        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 8px;
            transition: 0.3s;
        }

        .student-info {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 15px;
        }

        .roll-number {
            font-size: 16px;
            font-weight: bold;
            color: var(--neon-cyan);
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
            min-width: 80px;
        }

        .student-name-comment {
            font-size: 13px;
            color: var(--text-main);
        }

        .btn-present {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-present.active {
            background-color: var(--success);
            color: #000;
            border-color: var(--success);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(3, 218, 198, 0.6);
        }

        /* মডাল স্টাইল */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                inset 0 0 20px rgba(255, 255, 255, 0.05),
                0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
        }

        .modal-title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chibi-img {
            width: 35px;
            height: 35px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .history-container {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 10px;
        }

        .history-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 18px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: bold;
            color: var(--neon-cyan);
        }

        .history-list {
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.6;
            padding-right: 60px;
        }
        
        .history-list span {
            color: var(--text-muted);
            font-size: 13px;
        }

        .delete-history-btn {
            position: absolute;
            bottom: 18px;
            right: 18px;
            background: rgba(207, 102, 121, 0.15);
            color: var(--danger);
            border: 1px solid rgba(207, 102, 121, 0.4);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* কাস্টম পপ-আপ */
        .custom-alert-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .custom-alert-box {
            background: rgba(30, 30, 35, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 25px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 85%;
            max-width: 350px;
            text-align: center;
            transform: scale(0.9);
            transition: 0.3s;
        }

        .custom-alert-box.show { transform: scale(1); }

        .custom-alert-text {
            color: var(--text-main);
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .custom-alert-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .custom-alert-btn {
            background: linear-gradient(45deg, #8A2BE2, #00f0ff);
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 240, 255, 0.3);
            flex: 1;
        }

        .custom-alert-btn.cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ফিক্সড হেডার ও কন্ট্রোল সেকশন -->
        <div class="fixed-top-section">
            <div class="header">
                <h1>📋 <span class="shine-text">Attendance</span></h1>
                <button class="menu-btn" onclick="openMenu()">⋮</button>
            </div>

            <div class="controls">
                <input type="date" id="attendanceDate" onchange="loadTodayData()">
                <select id="subjectSelect" onchange="loadTodayData()">
                    <option value="Bangla-I">Bangla-I</option>
                    <option value="English-I">English-I</option>
                    <option value="Social Science">Social Science</option>
                    <option value="Chemistry">Chemistry</option>
                    <option value="Mathematics-I">Mathematics-I</option>
                    <option value="Engineering Drawing">Engineering Drawing</option>
                    <option value="Basic Environmental Eng">Basic Environmental Eng</option>
                    <option value="Basic Electricity">Basic Electricity</option>
                </select>
            </div>
        </div>

        <!-- স্ক্রলেবল লিস্ট -->
        <div class="scrollable-list" id="studentList">
            <!-- JS দিয়ে রোল লিস্ট এখানে লোড হবে -->
        </div>
    </div>

    <!-- হিস্ট্রি মডাল -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-area">
                    <img src="chibi.png" alt="Chibi Icon" class="chibi-img" onerror="this.style.display='none'">
                    <h3>Saved Records</h3>
                </div>
                <button class="close-btn" onclick="closeMenu()">&times;</button>
            </div>
            <div class="history-container" id="historyContainer">
                <!-- সেভ করা রেকর্ড এখানে দেখা যাবে -->
            </div>
        </div>
    </div>

    <!-- কাস্টম অ্যালার্ট -->
    <div id="customAlert" class="custom-alert-modal">
        <div class="custom-alert-box" id="customAlertBox">
            <p class="custom-alert-text" id="customAlertText"></p>
            <div class="custom-alert-buttons">
                <button class="custom-alert-btn cancel" id="cancelBtn" onclick="closeCustomAlert()">Cancel</button>
                <button class="custom-alert-btn" id="okBtn" onclick="confirmAction()">OK</button>
            </div>
        </div>
    </div>

    <script>
        const students = [
            { sn: "1", name: "Md. Shariful Islam", roll: "902002" },
            { sn: "2", name: "Angho Mondal Antor", roll: "902003" },
            { sn: "3", name: "Md. Khunshed Alam", roll: "902004" },
            { sn: "4", name: "Shatrirani Jahed Swadhin", roll: "902005" },
            { sn: "5", name: "Sajib Rahman", roll: "902008" },
            { sn: "6", name: "Ajay Kanti Nath", roll: "902009" },
            { sn: "7", name: "Ahsan Ullah Junayed", roll: "902010" },
            { sn: "8", name: "Md. Obaidul Haque", roll: "902011" },
            { sn: "9", name: "Md. Montasin Hasan", roll: "902012" },
            { sn: "10", name: "Pritam Barua", roll: "902013" },
            { sn: "11", name: "Rajon Bormik", roll: "902014" },
            { sn: "12", name: "Tamim Hossen", roll: "902015" },
            { sn: "13", name: "Tania Akter", roll: "902016" },
            { sn: "14", name: "Uttam Kumar Nath", roll: "902017" },
            { sn: "15", name: "Raj Kumar Chowdhury", roll: "902018" },
            { sn: "16", name: "Hossain Shahran Zaman", roll: "902019" },
            { sn: "17", name: "Bibi Fatema", roll: "902020" },
            { sn: "18", name: "Fakima Akter", roll: "902021" },
            { sn: "19", name: "Ajay Das", roll: "902022" },
            { sn: "20", name: "Md. Abdun Rahman Akib", roll: "902023" },
            { sn: "21", name: "Mahbub Alam", roll: "902024" },
            { sn: "22", name: "Ismahul Jahan Jamat", roll: "902025" },
            { sn: "23", name: "Saurabh Dey", roll: "902026" },
            { sn: "24", name: "Dipayen Dev Nath", roll: "902027" },
            { sn: "25", name: "Md. Sohidul Haque Sani", roll: "902030" },
            { sn: "26", name: "Arefin Ahmed Zihad", roll: "902031" },
            { sn: "27", name: "Md. Tahsin Rahman", roll: "902033" },
            { sn: "28", name: "Ankon Nath", roll: "902035" },
            { sn: "29", name: "Ibrahim Khalilullah Mahid", roll: "902036" },
            { sn: "30", name: "Abdul Kader Rafi", roll: "902037" },
            { sn: "31", name: "Wahidul Alam Nihel", roll: "902038" },
            { sn: "32", name: "Abdul Al Junnayed", roll: "902039" },
            { sn: "33", name: "Anik Das", roll: "902040" },
            { sn: "34", name: "Md. Asadul Islam", roll: "902041" },
            { sn: "35", name: "Sismoy Barua", roll: "902042" },
            { sn: "36", name: "Shahria Parvez Showrov", roll: "902043" },
            { sn: "37", name: "Anik Das Gupta", roll: "902044" },
            { sn: "38", name: "Rafa Sultana", roll: "902045" },
            { sn: "39", name: "Hashi Akter", roll: "902046" },
            { sn: "40", name: "Tazkia Jahangir Tazki", roll: "902401" },
            { sn: "41", name: "Nabed Rahman Siam", roll: "902402" },
            { sn: "42", name: "Md. Sohidul Alam", roll: "902403" },
            { sn: "43", name: "Jannatul Ferdous", roll: "902404" },
            { sn: "44", name: "Saidul Alam", roll: "9024" }
        ];

        let deleteTargetId = null; 

        window.onload = function() {
            let today = new Date().toISOString().split('T')[0];
            document.getElementById("attendanceDate").value = today;
            renderStudents();
            loadHistory();
            loadTodayData(); 
        };

        function renderStudents() {
            const listContainer = document.getElementById("studentList");
            listContainer.innerHTML = "";

            students.forEach((student, index) => {
                const div = document.createElement("div");
                div.className = "student-item";
                
                // নাম এবং রোল এক লাইনে (List View)
                div.innerHTML = `
                    <div class="student-info">
                        <span class="roll-number">${index + 1}. ${student.roll}</span>
                        <span class="student-name-comment">${student.name}</span>
                    </div>
                    <button class="btn-present" id="btn-${student.roll}" onclick="togglePresent('${student.roll}')">Present</button>
                `;
                listContainer.appendChild(div);
            });
        }

        function showCustomAlert(message, isConfirm = false, id = null) {
            document.getElementById("customAlertText").innerText = message;
            document.getElementById("customAlert").style.display = "flex";
            
            const cancelBtn = document.getElementById("cancelBtn");

            if (isConfirm) {
                cancelBtn.style.display = "block";
                deleteTargetId = id;
            } else {
                cancelBtn.style.display = "none";
                deleteTargetId = null;
            }

            setTimeout(() => {
                document.getElementById("customAlertBox").classList.add("show");
            }, 10);
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").classList.remove("show");
            setTimeout(() => {
                document.getElementById("customAlert").style.display = "none";
            }, 300);
        }

        function confirmAction() {
            if (deleteTargetId !== null) {
                let history = JSON.parse(localStorage.getItem("attendanceHistory")) || [];
                let updatedHistory = history.filter(record => record.id !== deleteTargetId);
                
                localStorage.setItem("attendanceHistory", JSON.stringify(updatedHistory));
                
                if (window.AppInventor) {
                    window.AppInventor.setWebViewString(JSON.stringify(updatedHistory));
                }
                
                loadHistory();
                loadTodayData();
                deleteTargetId = null;
            }
            closeCustomAlert();
        }

        function togglePresent(roll) {
            const btn = document.getElementById(`btn-${roll}`);
            const date = document.getElementById("attendanceDate").value;
            const subject = document.getElementById("subjectSelect").value;

            if (!date) { showCustomAlert("দয়া করে তারিখ সিলেক্ট করুন!"); return; }

            let history = JSON.parse(localStorage.getItem("attendanceHistory")) || [];
            let recordIndex = history.findIndex(r => r.date === date && r.subject === subject);

            if (btn.classList.contains("active")) {
                btn.classList.remove("active");
                btn.innerText = "Present";
                if (recordIndex !== -1) {
                    history[recordIndex].presentList = history[recordIndex].presentList.filter(r => r !== roll);
                }
            } else {
                btn.classList.add("active");
                btn.innerText = "Present ✓";
                
                if (recordIndex !== -1) {
                    if(!history[recordIndex].presentList.includes(roll)){
                        history[recordIndex].presentList.push(roll);
                    }
                } else {
                    history.unshift({ id: Date.now(), date: date, subject: subject, presentList: [roll] });
                }
            }

            history = history.filter(r => r.presentList.length > 0);

            localStorage.setItem("attendanceHistory", JSON.stringify(history));
            if (window.AppInventor) {
                window.AppInventor.setWebViewString(JSON.stringify(history));
            }
            
            loadHistory(); 
        }

        function loadTodayData() {
            const date = document.getElementById("attendanceDate").value;
            const subject = document.getElementById("subjectSelect").value;
            let history = JSON.parse(localStorage.getItem("attendanceHistory")) || [];
            
            let record = history.find(r => r.date === date && r.subject === subject);

            students.forEach(student => {
                const btn = document.getElementById(`btn-${student.roll}`);
                if(btn) {
                    btn.classList.remove("active");
                    btn.innerText = "Present";
                }
            });

            if (record) {
                record.presentList.forEach(roll => {
                    const btn = document.getElementById(`btn-${roll}`);
                    if (btn) {
                        btn.classList.add("active");
                        btn.innerText = "Present ✓";
                    }
                });
            }
        }

        function openMenu() {
            document.getElementById("historyModal").style.display = "flex";
        }

        function closeMenu() {
            document.getElementById("historyModal").style.display = "none";
        }

        function loadHistory() {
            const historyContainer = document.getElementById("historyContainer");
            let history = JSON.parse(localStorage.getItem("attendanceHistory")) || [];
            
            if (history.length === 0) {
                historyContainer.innerHTML = "<p style='color:#a0a0a0; font-size:14px; text-align:center;'>এখনো কোনো রেকর্ড নেই।</p>";
                return;
            }

            historyContainer.innerHTML = "";
            history.forEach(record => {
                const card = document.createElement("div");
                card.className = "history-card";
                
                let presentRollsStr = record.presentList.join(", ");

                card.innerHTML = `
                    <div class="history-header">
                        <span>${record.subject}</span>
                        <span>${record.date}</span>
                    </div>
                    <div class="history-list">
                        <b>Present Rolls (${record.presentList.length}):</b><br>
                        <span>${presentRollsStr}</span>
                    </div>
                    <button class="delete-history-btn" onclick="deleteRecord(${record.id})">Delete</button>
                `;
                historyContainer.appendChild(card);
            });
        }

        function deleteRecord(id) {
            showCustomAlert("তুমি কি সত্যিই এই রেকর্ডটা মুছে ফেলতে চাও?", true, id);
        }
    </script>
</body>
</html>
